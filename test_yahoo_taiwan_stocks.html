<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yahoo Finance 台股數據測試</title>
<style>
body { font-family: monospace; padding: 20px; background: #f5f4ef; }
.container { max-width: 1200px; margin: 0 auto; }
h1 { color: #1a1a18; margin-bottom: 20px; }
.test-section { background: white; border: 1px solid #e8e6df; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
.test-header { font-weight: bold; font-size: 14px; color: #378ADD; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 2px solid #378ADD; }
.result { font-size: 12px; line-height: 1.6; }
.field { display: grid; grid-template-columns: 150px 1fr 80px; gap: 10px; padding: 8px; border-bottom: 1px solid #f0ede6; }
.field-name { color: #888780; font-weight: 600; }
.field-value { color: #1a1a18; }
.field-status { text-align: center; font-weight: bold; }
.ok { color: #3B6D11; }
.warn { color: #854F0B; }
.fail { color: #A32D2D; }
.loading { color: #378ADD; }
.summary { background: #EAF3DE; border: 1px solid #97C459; border-radius: 6px; padding: 12px; margin-top: 15px; }
.summary-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
<h1>🇹🇼 Yahoo Finance 台股數據測試</h1>
<p style="color: #888780; margin-bottom: 20px;">測試 10 支台股，檢查哪些數據字段有、哪些缺失</p>

<div id="test-container"></div>

<div style="margin-top: 30px; padding: 15px; background: #fff; border-radius: 8px; border: 1px solid #e8e6df;">
<h2 style="margin-bottom: 15px; font-size: 14px;">📊 測試總結</h2>
<div id="summary"></div>
</div>
</div>

<script>
const taiwanStocks = [
  { symbol: '2330.TW', name: '台積電' },
  { symbol: '2412.TW', name: '中華電' },
  { symbol: '1101.TW', name: '台泥' },
  { symbol: '2882.TW', name: '國泰金' },
  { symbol: '2308.TW', name: '台達電' },
  { symbol: '3008.TW', name: '大立光' },
  { symbol: '2454.TW', name: '聯發科' },
  { symbol: '1216.TW', name: '統一超' },
  { symbol: '2395.TW', name: '財訊' },
  { symbol: '2603.TW', name: '長榮' }
];

const fieldsToCheck = [
  { key: 'trailingPE', name: '本益比(PE)', category: '估值' },
  { key: 'pegRatio', name: 'PEG比率', category: '估值' },
  { key: 'grossMargins', name: '毛利率', category: '獲利' },
  { key: 'operatingMargins', name: '營業利率', category: '獲利' },
  { key: 'profitMargins', name: '淨利率', category: '獲利' },
  { key: 'freeCashflow', name: '自由現金流', category: '現金流' },
  { key: 'revenueGrowth', name: '營收增速', category: '增長' },
  { key: 'earningsGrowth', name: '盈利增速', category: '增長' },
  { key: 'payoutRatio', name: '配息率', category: '配利' },
  { key: 'priceToBook', name: '市淨率', category: '估值' }
];

async function fetchYahooData(ticker) {
  // 方法 1：嘗試官方 API（帶 CORS 代理）
  const tryOfficialAPI = async () => {
    const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=defaultKeyStatistics,summaryDetail,assetProfile,financialData`;

    try {
      const response = await fetch(`https://cors-anywhere.herokuapp.com/${url}`, {
        headers: { 'User-Agent': 'Mozilla/5.0' },
        signal: AbortSignal.timeout(8000)
      });

      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const result = data?.quoteSummary?.result?.[0];
      if (!result) throw new Error('no data');
      return { method: 'official', data: result };
    } catch (e) {
      return null;
    }
  };

  // 方法 2：簡單抓股價頁面
  const trySimplePage = async () => {
    try {
      const url = `https://finance.yahoo.com/quote/${ticker}`;
      const response = await fetch(`https://cors-anywhere.herokuapp.com/${url}`, {
        signal: AbortSignal.timeout(8000)
      });

      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const html = await response.text();

      // 簡單解析 JSON 數據
      const jsonMatch = html.match(/root\.App\.main\s*=\s*(\{.+?\});/s);
      if (!jsonMatch) throw new Error('no json');

      const appData = JSON.parse(jsonMatch[1]);
      const result = appData?.context?.dispatcher?.stores?.QuoteSummaryStore;
      if (!result) throw new Error('no store');

      return { method: 'page', data: result };
    } catch (e) {
      return null;
    }
  };

  try {
    // 先試官方 API
    let result = await tryOfficialAPI();
    if (result) return { success: true, ...result };

    // 再試頁面抓取
    result = await trySimplePage();
    if (result) return { success: true, ...result };

    // 都失敗了
    return {
      success: false,
      error: '無法連接 Yahoo Finance（可能被限流或 CORS 限制）',
      method: 'failed'
    };
  } catch (error) {
    return {
      success: false,
      error: error.message,
      method: 'error'
    };
  }
}

async function runTests() {
  const container = document.getElementById('test-container');
  const summary = { total: 0, hasData: 0, partial: 0, empty: 0, byCategory: {} };
  
  for (const stock of taiwanStocks) {
    const section = document.createElement('div');
    section.className = 'test-section';
    section.innerHTML = `
      <div class="test-header">${stock.symbol} — ${stock.name} <span style="color: #888780; font-weight: normal;"> 加載中...</span></div>
      <div class="result" id="result-${stock.symbol}"></div>
    `;
    container.appendChild(section);
    
    const result = await fetchYahooData(stock.symbol);
    const resultDiv = document.getElementById(`result-${stock.symbol}`);

    if (!result.success) {
      resultDiv.innerHTML = `
        <div class="fail">❌ 錯誤: ${result.error}</div>
        <div style="color: #888780; font-size: 11px; margin-top: 10px;">
          <p>可能的原因：</p>
          <ul style="margin: 5px 0; padding-left: 20px;">
            <li>Yahoo Finance API 被限流</li>
            <li>CORS 限制（跨域請求被阻止）</li>
            <li>台股代碼格式問題</li>
            <li>網絡連接問題</li>
          </ul>
        </div>
      `;
      continue;
    }

    const data = result.data || {};
    let html = '';
    let hasCount = 0;
    let categoryStatus = {};
    
    for (const field of fieldsToCheck) {
      const value = data[field.key];
      const hasValue = value !== null && value !== undefined && value !== '';
      
      if (hasValue) hasCount++;
      
      if (!categoryStatus[field.category]) {
        categoryStatus[field.category] = { total: 0, has: 0 };
      }
      categoryStatus[field.category].total++;
      if (hasValue) categoryStatus[field.category].has++;
      
      const displayValue = hasValue 
        ? (typeof value === 'number' ? (value > 1 ? value.toFixed(2) : (value * 100).toFixed(1) + '%') : String(value).substring(0, 50))
        : '（無）';
      
      const status = hasValue ? `<span class="ok">✓</span>` : `<span class="fail">✗</span>`;
      
      html += `
        <div class="field">
          <div class="field-name">${field.name}</div>
          <div class="field-value">${displayValue}</div>
          <div class="field-status">${status}</div>
        </div>
      `;
    }
    
    const completeness = Math.round((hasCount / fieldsToCheck.length) * 100);
    const completenessBg = completeness >= 80 ? '#EAF3DE' : completeness >= 50 ? '#FAEEDA' : '#FCEBEB';
    const completenessColor = completeness >= 80 ? '#3B6D11' : completeness >= 50 ? '#854F0B' : '#A32D2D';
    
    resultDiv.innerHTML = html + `
      <div style="margin-top: 10px; padding: 10px; background: ${completenessBg}; border-radius: 4px; color: ${completenessColor}; font-weight: bold; text-align: center;">
        完整度: ${completeness}% (${hasCount}/${fieldsToCheck.length})
      </div>
    `;
    
    summary.total += fieldsToCheck.length;
    summary.hasData += hasCount;
    
    for (const [cat, stat] of Object.entries(categoryStatus)) {
      if (!summary.byCategory[cat]) summary.byCategory[cat] = { total: 0, has: 0 };
      summary.byCategory[cat].total += stat.total;
      summary.byCategory[cat].has += stat.has;
    }
    
    // 延遲，避免被限流
    await new Promise(r => setTimeout(r, 1500));
  }
  
  // 生成總結
  const summaryDiv = document.getElementById('summary');
  let summaryHtml = `
    <div class="summary-item">
      <span>📊 整體完整度</span>
      <strong>${Math.round((summary.hasData / summary.total) * 100)}% (${summary.hasData}/${summary.total})</strong>
    </div>
  `;
  
  for (const [cat, stat] of Object.entries(summary.byCategory)) {
    const pct = Math.round((stat.has / stat.total) * 100);
    const color = pct >= 80 ? 'ok' : pct >= 50 ? 'warn' : 'fail';
    summaryHtml += `
      <div class="summary-item">
        <span>📈 ${cat}</span>
        <strong class="${color}">${pct}% (${stat.has}/${stat.total})</strong>
      </div>
    `;
  }
  
  summaryDiv.innerHTML = summaryHtml;
}

// 頁面加載時執行
window.addEventListener('load', runTests);
</script>
</body>
</html>
