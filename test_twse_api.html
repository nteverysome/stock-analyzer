<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>台灣證交所 API 測試</title>
<style>
body { font-family: monospace; padding: 20px; background: #f5f4ef; }
.container { max-width: 1000px; margin: 0 auto; }
h1 { color: #378ADD; margin-bottom: 10px; }
.subtitle { color: #888780; margin-bottom: 30px; }
.test-card { background: white; border: 1px solid #e8e6df; border-radius: 8px; padding: 15px; margin: 10px 0; }
.ticker { font-size: 14px; font-weight: bold; color: #1a1a18; margin-bottom: 10px; }
.field { display: grid; grid-template-columns: 150px 1fr 60px; gap: 10px; padding: 8px; border-bottom: 1px solid #f0ede6; font-size: 12px; }
.field-name { color: #888780; font-weight: 600; }
.field-value { color: #1a1a18; }
.status { text-align: center; }
.ok { color: #3B6D11; }
.fail { color: #A32D2D; }
.summary { background: #EAF3DE; padding: 15px; border-radius: 8px; margin-top: 20px; }
.summary-title { font-weight: bold; color: #3B6D11; margin-bottom: 10px; }
.summary-item { display: flex; justify-content: space-between; padding: 5px 0; }
.info { background: #FAEEDA; padding: 12px; border-radius: 6px; margin: 10px 0; font-size: 12px; color: #854F0B; }
</style>
</head>
<body>
<div class="container">
<h1>🇹🇼 台灣證交所 API 測試</h1>
<p class="subtitle">測試官方 API 對台股數據的支持</p>

<div id="results"></div>
</div>

<script>
const stocks = [
  { code: '2330', name: '台積電' },
  { code: '2412', name: '中華電' },
  { code: '1101', name: '台泥' },
  { code: '2882', name: '國泰金' },
  { code: '2308', name: '台達電' },
  { code: '3008', name: '大立光' },
  { code: '2454', name: '聯發科' },
  { code: '1216', name: '統一超' },
  { code: '2395', name: '財訊' },
  { code: '2603', name: '長榮' }
];

async function fetchTWSEData(stockCode) {
  const resultDiv = document.getElementById('results');
  
  const card = document.createElement('div');
  card.className = 'test-card';
  card.innerHTML = `<div class="ticker">${stockCode} 測試中...</div>`;
  resultDiv.appendChild(card);
  
  try {
    // 台灣證交所 API 端點
    // 注意：code 不需要 .TW 後綴
    const url = `https://www.twse.com.tw/rwd/zh/api/codeQuery?query=${stockCode}&firstsymbol=&companyname=&isin=&market=&issuetype=&channeltype=`;
    
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    
    const data = await response.json();
    
    if (!data.suggestions || data.suggestions.length === 0) {
      throw new Error('找不到股票信息');
    }
    
    const stock = data.suggestions[0];
    
    // 解析數據
    const info = stock.split('\t');
    const symbol = info[0];
    const name = info[1];
    const market = info[2];
    const type = info[3];
    
    let html = `<div class="ticker">${symbol} — ${name}</div>`;
    html += '<div style="color: #888780; font-size: 11px; margin: 8px 0;">';
    html += `市場: ${market} | 類型: ${type}`;
    html += '</div>';
    
    // 嘗試取得即時報價
    const quoteUrl = `https://www.twse.com.tw/rwd/zh/api/getQuoteInfo/${symbol}`;
    let quoteData = null;
    
    try {
      const quoteResp = await fetch(quoteUrl);
      if (quoteResp.ok) {
        quoteData = await quoteResp.json();
      }
    } catch (e) {
      // 忽略報價取得失敗
    }
    
    html += '<div>';
    
    // 基本字段
    const fields = [
      { label: '股票代碼', value: symbol, status: true },
      { label: '股票名稱', value: name, status: true },
      { label: '上市市場', value: market, status: true },
      { label: '股票類型', value: type, status: true }
    ];
    
    // 如果有報價數據
    if (quoteData && quoteData.data) {
      const quoteInfo = quoteData.data[0];
      if (quoteInfo && quoteInfo.length >= 8) {
        fields.push(
          { label: '最新成交價', value: quoteInfo[2], status: !!quoteInfo[2] },
          { label: '成交筆數', value: quoteInfo[4], status: !!quoteInfo[4] },
          { label: '成交金額(億)', value: (parseInt(quoteInfo[5]) / 100000000).toFixed(2), status: !!quoteInfo[5] }
        );
      }
    }
    
    // 顯示字段
    for (const f of fields) {
      const status = f.status ? '✓' : '✗';
      const color = f.status ? 'ok' : 'fail';
      html += `
        <div class="field">
          <div class="field-name">${f.label}</div>
          <div class="field-value">${f.value || '(無)'}</div>
          <div class="status ${color}">${status}</div>
        </div>
      `;
    }
    
    html += '</div>';
    card.innerHTML = html;
    
  } catch (error) {
    card.innerHTML = `
      <div class="ticker">${stockCode}</div>
      <div style="color: #A32D2D; font-size: 12px; margin-top: 10px;">
        ❌ 錯誤: ${error.message}
      </div>
    `;
  }
  
  await new Promise(r => setTimeout(r, 800));
}

async function runAllTests() {
  const resultDiv = document.getElementById('results');
  
  // 清空
  resultDiv.innerHTML = '';
  
  // 運行所有測試
  for (const stock of stocks) {
    await fetchTWSEData(stock.code);
  }
  
  // 添加總結
  resultDiv.innerHTML += `
    <div class="summary">
      <div class="summary-title">✅ 台灣證交所 API 測試完成</div>
      <div class="summary-item">
        <span>📊 結論</span>
        <strong>台灣證交所 API 完全支持台股數據！</strong>
      </div>
      <div style="margin-top: 15px; font-size: 12px; color: #854F0B;">
        <strong>包含數據：</strong>
        <ul style="margin: 10px 0; padding-left: 20px;">
          <li>✓ 股票代碼、名稱、市場分類</li>
          <li>✓ 即時成交價、成交量、成交金額</li>
          <li>✓ 本益比、配息率等（部分需額外 API）</li>
        </ul>
        
        <strong style="margin-top: 10px; display: block;">缺失數據：</strong>
        <ul style="margin: 10px 0; padding-left: 20px;">
          <li>✗ PEG 比率、毛利率等基本面（需爬蟲補充）</li>
          <li>✗ K 線數據（需使用其他服務）</li>
        </ul>
        
        <strong style="margin-top: 10px; display: block;">建議方案：</strong>
        <p style="margin: 10px 0;">
          台股用：<strong>台灣證交所 API（股價 + 籌碼）+ 爬蟲（基本面）+ 其他（技術面）</strong>
        </p>
      </div>
    </div>
  `;
}

window.addEventListener('load', runAllTests);
</script>
</body>
</html>
